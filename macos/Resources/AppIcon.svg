<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5cf0"/>
      <stop offset="1" stop-color="#1fb6a8"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#cfd5e2"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2032"/>
      <stop offset="1" stop-color="#2d3550"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ffcff"/>
      <stop offset="0.6" stop-color="#28e0ff"/>
      <stop offset="1" stop-color="#28e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1030" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- antenna -->
  <rect x="496" y="208" width="32" height="110" rx="16" fill="#aeb6c8"/>
  <circle cx="512" cy="196" r="46" fill="url(#bulb)" filter="url(#soft)"/>
  <circle cx="498" cy="182" r="12" fill="#fff" opacity="0.7"/>

  <!-- ears -->
  <rect x="200" y="470" width="60" height="150" rx="24" fill="#aeb6c8" filter="url(#soft)"/>
  <rect x="764" y="470" width="60" height="150" rx="24" fill="#aeb6c8" filter="url(#soft)"/>

  <!-- head -->
  <rect x="244" y="318" width="536" height="470" rx="110" fill="url(#head)" filter="url(#soft)"/>

  <!-- visor -->
  <rect x="300" y="384" width="424" height="210" rx="78" fill="url(#visor)"/>

  <!-- left eye: wide open -->
  <circle cx="412" cy="489" r="58" fill="url(#glow)"/>
  <circle cx="412" cy="489" r="30" fill="#e8ffff"/>
  <circle cx="424" cy="478" r="9" fill="#fff"/>

  <!-- right eye: squinting (raised brow) -->
  <circle cx="612" cy="489" r="58" fill="url(#glow)"/>
  <path d="M568 489 q44 -40 88 0 q-44 36 -88 0 z" fill="#e8ffff"/>
  <path d="M560 440 q52 -34 104 -4" stroke="#1b2032" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M560 440 q52 -34 104 -4" stroke="#cfd5e2" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- smirk grille -->
  <path d="M392 656 q120 80 240 -14" stroke="#7b84a0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M448 674 v-30 M512 694 v-34 M576 676 v-34" stroke="#7b84a0" stroke-width="18" stroke-linecap="round"/>

  <!-- cheek bolts -->
  <circle cx="312" cy="690" r="18" fill="#aeb6c8"/>
  <circle cx="712" cy="690" r="18" fill="#aeb6c8"/>
  <path d="M302 690 h20 M312 680 v20 M702 690 h20 M712 680 v20" stroke="#7b84a0" stroke-width="5" stroke-linecap="round"/>
</svg>
